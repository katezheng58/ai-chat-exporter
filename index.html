<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天记录导出工具</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cornflower: '#6495ED', // 矢车菊蓝
                        cornflowerDark: '#4169E1',
                        paper: '#FDFBF7',      // 米白色背景
                        earth: '#8B4513',      // 棕色
                        sand: '#D2B48C',       // 浅棕/沙色
                        ink: '#2C3E50',        // 深色文字
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background-color: #FDFBF7; color: #2C3E50; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-custom::-webkit-scrollbar { width: 6px; }
        .scrollbar-custom::-webkit-scrollbar-track { background: #f1f1f1; }
        .scrollbar-custom::-webkit-scrollbar-thumb { background: #D2B48C; border-radius: 3px; }
        .card-shadow { box-shadow: 0 4px 6px -1px rgba(139, 69, 19, 0.1), 0 2px 4px -1px rgba(139, 69, 19, 0.06); }
        /* 简单的 checkbox 样式 */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #6495ED;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #6495ED;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- 工具函数 ---
        const formatDate = (timestamp) => {
            if (!timestamp) return '未知时间';
            // 尝试处理秒级时间戳（如果是10位）和毫秒级（13位）
            let date;
            if (typeof timestamp === 'number' && timestamp < 10000000000) {
                date = new Date(timestamp * 1000);
            } else {
                date = new Date(timestamp);
            }
            if (isNaN(date.getTime())) return '未知时间';
            return date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        };

        const countWords = (str) => {
            if (!str) return 0;
            const chinese = (str.match(/[\u4e00-\u9fa5]/g) || []).length;
            const english = (str.match(/[a-zA-Z0-9]+/g) || []).length;
            return chinese + english;
        };

        // --- 数据解析核心 ---
        
        // 专门处理 DeepSeek 的 fragments
        const extractDeepSeekContent = (fragments) => {
            if (!Array.isArray(fragments)) return { text: "", role: "unknown" };
            
            let role = "assistant"; // 默认为助手
            let contentParts = [];

            fragments.forEach(frag => {
                if (frag.type === 'REQUEST') role = 'user'; // 明确是用户
                if (frag.type === 'THINK') {
                    // 可以选择是否保留思考过程，这里保留但加标记
                    contentParts.push(`> [深度思考]\n> ${frag.content}\n\n`);
                }
                if (frag.type === 'RESPONSE' || frag.type === 'text') { // 兼容
                    contentParts.push(frag.content);
                }
            });

            return { text: contentParts.join(""), role };
        };

        const parseChatData = (json, sourceType) => {
            let chats = [];
            let rawData = json;

            // 1. 尝试标准化输入
            if (!Array.isArray(json) && json.conversations) rawData = json.conversations;
            if (!Array.isArray(rawData)) rawData = [rawData]; // 单个对象转数组

            // 2. 遍历解析
            chats = rawData.map(chatItem => {
                // 基础信息提取
                let title = chatItem.title || chatItem.name || "未命名对话";
                let id = chatItem.uuid || chatItem.id || chatItem.conversation_id || Math.random().toString(36).substr(2, 9);
                let createTime = chatItem.create_time || chatItem.created_at || chatItem.created || chatItem.inserted_at || Date.now();
                let messages = [];

                // --- 策略 A: DeepSeek / ChatGPT (Mapping 结构) ---
                if (chatItem.mapping) {
                    // 这是一个基于节点的图结构 (ChatGPT/DeepSeek)
                    const mapping = chatItem.mapping;
                    const msgNodes = [];
                    
                    Object.values(mapping).forEach(node => {
                        const msg = node.message;
                        // 过滤掉空消息或系统隐藏消息
                        if (msg && (msg.content || msg.fragments) && (msg.author?.role !== 'system')) {
                            let content = "";
                            let role = "unknown";
                            let time = msg.create_time || msg.inserted_at;

                            // DeepSeek 特有逻辑
                            if (msg.fragments) {
                                const dsData = extractDeepSeekContent(msg.fragments);
                                content = dsData.text;
                                role = dsData.role;
                            } 
                            // ChatGPT / 通用 Mapping 逻辑
                            else if (msg.content) {
                                role = msg.author?.role || 'assistant';
                                if (typeof msg.content === 'string') content = msg.content;
                                else if (msg.content.parts) content = msg.content.parts.join("");
                            }

                            if (content.trim()) {
                                msgNodes.push({ role, content, create_time: time });
                            }
                        }
                    });

                    // 排序：DeepSeek 的 inserted_at 是 ISO 字符串，ChatGPT 是时间戳
                    messages = msgNodes.sort((a, b) => {
                        const tA = new Date(a.create_time).getTime();
                        const tB = new Date(b.create_time).getTime();
                        return tA - tB;
                    });
                }
                // ... (上接 策略 A: DeepSeek / ChatGPT)

                // --- 策略 C: Grok (Conversation + Responses 结构) ---
                else if (chatItem.conversation && Array.isArray(chatItem.responses)) {
                    // 1. 提取标题和时间
                    if (chatItem.conversation.title) title = chatItem.conversation.title;
                    if (chatItem.conversation.create_time) createTime = chatItem.conversation.create_time;
                    id = chatItem.conversation.id || id;

                    // 2. 提取消息
                    messages = chatItem.responses.map(item => {
                        const r = item.response;
                        if (!r) return null;

                        // 处理 Grok 的角色 human -> user
                        let role = r.sender || 'unknown';
                        if (role === 'human') role = 'user';

                        // 处理内容 (Grok 的内容直接在 message 字段)
                        let content = r.message || "";

                        // (可选) 处理 Grok 的时间戳格式 { "$date": { "$numberLong": "..." } }
                        let msgTime = null;
                        if (r.create_time && r.create_time.$date && r.create_time.$date.$numberLong) {
                            msgTime = parseInt(r.create_time.$date.$numberLong);
                        }

                        // 过滤空消息 (有时候 Grok 会有空思考步骤)
                        if (!content) return null;

                        return { 
                            role, 
                            content, 
                            create_time: msgTime 
                        };
                    }).filter(Boolean); // 移除 null
                }

                
                // --- 策略 B: Claude / 通用列表 ---
                else if (chatItem.chat_messages || Array.isArray(chatItem.messages)) {
                    const list = chatItem.chat_messages || chatItem.messages;
                    messages = list.map(m => {
                        // 归一化 Role
                        let role = m.sender || m.role || 'unknown';
                        if (role === 'human') role = 'user';
                        
                        // 归一化 Content
                        let text = m.text || m.content || "";
                        if (Array.isArray(text)) text = text.map(t => t.text || "").join(""); // 处理 Claude 的复杂 content
                        
                        return { role, content: text };
                    });
                }


                // 计算统计信息
                let totalWords = 0;
                let fullText = "";
                messages.forEach(m => {
                    totalWords += countWords(m.content);
                    fullText += m.content + " ";
                });

                if (messages.length === 0) return null;

                return {
                    uuid: id,
                    name: title,
                    created_at: createTime,
                    messages: messages,
                    wordCount: totalWords,
                    fullTextSearch: (title + " " + fullText).toLowerCase()
                };
            }).filter(Boolean);

            // 按最后更新时间或创建时间排序
            return chats.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        };
// --- 辅助函数：解析 Gemini 的中文时间 ---
	const parseGeminiDate = (dateStr) => {
    if (!dateStr) return 0;
    try {
        // 匹配格式：2025年5月26日 12:31:40 PST
        // 或者：2026年1月11日 15:19:05 PST
        // 甚至：May 26, 2025, 12:31:40 PM
        let timestamp = 0;
        
        // 1. 尝试匹配中文年月日
        // 正则解释：(\d{4})年 匹配年份，以此类推
        const cnRegex = /(\d{4})年(\d{1,2})月(\d{1,2})日\s+(\d{1,2}):(\d{1,2}):(\d{1,2})/;
        const cnMatch = dateStr.match(cnRegex);
        
        if (cnMatch) {
            const [_, y, m, d, h, min, s] = cnMatch;
            // 注意：月份从0开始计数
            timestamp = new Date(y, m - 1, d, h, min, s).getTime();
        } else {
            // 2. 尝试英文格式，去掉 PST/PDT 时区后缀直接解析
            const cleanStr = dateStr.replace(/PST|PDT/g, '').trim();
            timestamp = new Date(cleanStr).getTime();
        }
        
        return isNaN(timestamp) ? 0 : timestamp;
    } catch (e) {
        return 0;
    }
};
// --- 新增：Gemini HTML 解析器 ---
// --- 新增：Gemini HTML 解析器 (引入时间分组逻辑) ---
        const parseGeminiHTML = (htmlString) => {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlString, 'text/html');
            const items = Array.from(doc.querySelectorAll('.outer-cell'));
            
            if (items.length === 0) return [];

            // 第一步：提取所有原始交互记录
            let rawInteractions = items.map(item => {
                const contentCell = item.querySelector('.content-cell');
                if (!contentCell) return null;
                
                const fullText = contentCell.textContent;

                // 1. 解析时间 (使用更强的正则，支持中文格式)
                // 格式：2023年10月1日 12:00:00 UTC 或 PST/PDT
                const timeMatch = fullText.match(/(\d{4})年(\d{1,2})月(\d{1,2})日\s+(\d{1,2}):(\d{2}):(\d{2})/);
                let timestamp = 0;
                
                if (timeMatch) {
                    const [_, year, month, day, hour, minute, second] = timeMatch;
                    // 处理时区：Google导出通常带有PST/PDT后缀，这里做简单的Date解析
                    // 为了保证排序准确，这里统一转为时间戳
                    let date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day), parseInt(hour), parseInt(minute), parseInt(second));
                    
                    // 简单的时区修正 (如果是PDT/PST，通常比北京时间慢15/16小时)
                    // 如果需要极高精度可引入Program A的时区判断，这里为简化逻辑，主要依赖相对时间差
                    if (fullText.includes('PDT') || fullText.includes('PST')) {
                        // 粗略补偿，确保相对顺序正确即可
                        date = new Date(date.getTime() + 15 * 60 * 60 * 1000); 
                    }
                    timestamp = date.getTime();
                } else {
                    // 尝试解析英文格式或其他格式
                    // 移除 "Prompted" 等干扰词后尝试解析日期
                    const possibleDate = fullText.split('Prompted')[0].trim();
                    const d = new Date(possibleDate);
                    if (!isNaN(d.getTime())) timestamp = d.getTime();
                }

                // 2. 提取用户消息
                const promptMatch = fullText.match(/Prompted\s+([\s\S]+?)\d{4}年/);
                let userMessage = promptMatch ? promptMatch[1].trim() : '';
                // 备用提取
                if (!userMessage) {
                     const parts = fullText.split('\n');
                     if (parts.length > 0 && parts[0].includes('Prompted')) {
                         userMessage = parts[0].replace('Prompted', '').trim();
                     }
                }

                // 3. 提取AI消息
                let aiMessage = '';
                const pTags = contentCell.querySelectorAll('p');
                pTags.forEach(p => {
                    const pText = p.textContent.trim();
                    if (pText && !pText.startsWith('Prompted') && !/^\d{4}年/.test(pText)) {
                        aiMessage += pText + "\n\n";
                    }
                });

                if (!userMessage && !aiMessage) return null;

                return {
                    timestamp,
                    userMessage,
                    aiMessage: aiMessage.trim()
                };
            }).filter(Boolean);

            // 第二步：按时间正序排序 (旧 -> 新)，这是分组的前提
            rawInteractions.sort((a, b) => a.timestamp - b.timestamp);

            // 第三步：按时间间隔分组 (模拟 Session)
            const groupedChats = [];
            if (rawInteractions.length === 0) return [];

            // 设定分组阈值：7天 (604800000毫秒)
            // 如果两条消息间隔超过7天，视为新的对话窗口
            const TIME_THRESHOLD = 7 * 24 * 60 * 60 * 1000;

            let currentChat = {
                startTime: rawInteractions[0].timestamp,
                endTime: rawInteractions[0].timestamp,
                items: []
            };

            rawInteractions.forEach((item, index) => {
                const prevItem = index > 0 ? rawInteractions[index - 1] : null;
                
                // 判断是否需要切分新组
                if (prevItem && (item.timestamp - prevItem.timestamp > TIME_THRESHOLD)) {
                    groupedChats.push(currentChat);
                    currentChat = {
                        startTime: item.timestamp,
                        endTime: item.timestamp,
                        items: []
                    };
                }

                currentChat.items.push(item);
                currentChat.endTime = item.timestamp; // 更新结束时间
            });
            // 加入最后一组
            groupedChats.push(currentChat);

            // 第四步：转换为 App 需要的通用格式
            return groupedChats.map(group => {
                const firstUserMsg = group.items.find(i => i.userMessage)?.userMessage || "Gemini 对话";
                let title = firstUserMsg.substring(0, 30).replace(/[\r\n]/g, ' ');
                if (firstUserMsg.length > 30) title += "...";
                
                // 构造消息列表 (扁平化)
                const messages = [];
                let totalWords = 0;
                let fullText = "";

                group.items.forEach(item => {
                    if (item.userMessage) {
                        messages.push({ role: 'user', content: item.userMessage });
                        totalWords += countWords(item.userMessage);
                        fullText += item.userMessage + " ";
                    }
                    if (item.aiMessage) {
                        messages.push({ role: 'model', content: item.aiMessage });
                        totalWords += countWords(item.aiMessage);
                        fullText += item.aiMessage + " ";
                    }
                });

                return {
                    uuid: Math.random().toString(36).substr(2, 9),
                    name: title, // 使用第一条消息作为标题
                    created_at: group.startTime, // 使用该组第一条消息的时间
                    last_updated: group.endTime,
                    messages: messages,
                    wordCount: totalWords,
                    fullTextSearch: (title + " " + fullText).toLowerCase()
                };
            }).sort((a, b) => b.created_at - a.created_at); // 最终列表按最新的对话在前排序
        };

        // --- 主程序 ---

        function App() {
            const [conversations, setConversations] = useState([]);
            const [fileName, setFileName] = useState('');
            const [selectedIds, setSelectedIds] = useState(new Set()); // 改为 Set 支持多选
            const [searchQuery, setSearchQuery] = useState('');
            const [viewMode, setViewMode] = useState('list'); 
            const [dataSource, setDataSource] = useState('auto'); // 预留给手动指定来源
            const [downloadMode, setDownloadMode] = useState('merge'); // 'merge'(合并) | 'separate'(独立)
            // 导出设置
            const [exportFormat, setExportFormat] = useState('doc'); 
            const [cleanDocMode, setCleanDocMode] = useState(false);

            const resetApp = () => {
                if (confirm("确定要返回首页吗？当前已解析的数据将被清空。")) {
                    setConversations([]);
                    setFileName('');
                    setSelectedIds(new Set());
                    setSearchQuery('');
                }
            };

            // --- 文件上传处理 ---
            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                
                setFileName(file.name);
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const result = e.target.result;
                    let processed = [];

                    try {
                        // 1. 尝试作为 JSON 解析 (Claude, DeepSeek, ChatGPT, Grok)
                        const json = JSON.parse(result);
                        processed = parseChatData(json, dataSource);
                        console.log("JSON 解析成功，条目数:", processed.length);
                    } catch (err) {
                        // 2. JSON 失败，尝试 HTML 解析 (Gemini)
                        console.log("JSON 解析失败，尝试 HTML 模式...");
                        // 简单的检查：是否包含 HTML 标签
                        if (result.trim().includes('<html') || result.trim().includes('<div')) {
                            try {
                                processed = parseGeminiHTML(result);
                                console.log("HTML 解析成功，条目数:", processed.length);
                            } catch (htmlErr) {
                                console.error("HTML 解析严重错误:", htmlErr);
                            }
                        }
                    }
                    
                    if (!processed || processed.length === 0) {
                        alert("未识别到有效的对话数据");
                        return;
                    }

                    // 统一按时间排序 (如果解析器没排序的话)
                    processed.sort((a, b) => {
                        const tA = new Date(a.created_at).getTime() || 0;
                        const tB = new Date(b.created_at).getTime() || 0;
                        return tB - tA;
                    });

                    setConversations(processed);
                };
                
                reader.readAsText(file);
            };
            const filteredConversations = useMemo(() => {
                if (!searchQuery) return conversations;
                const lowerQuery = searchQuery.toLowerCase();
                return conversations.filter(c => 
                    c.name.toLowerCase().includes(lowerQuery) || 
                    c.fullTextSearch.includes(lowerQuery)
                );
            }, [conversations, searchQuery]);

            // 多选逻辑
            const toggleSelect = (id) => {
                const newSet = new Set(selectedIds);
                if (newSet.has(id)) newSet.delete(id);
                else newSet.add(id);
                setSelectedIds(newSet);
            };

            const toggleSelectAll = () => {
                if (selectedIds.size === filteredConversations.length) {
                    setSelectedIds(new Set());
                } else {
                    setSelectedIds(new Set(filteredConversations.map(c => c.uuid)));
                }
            };

            // 批量导出逻辑
            // --- 替换原有的 generateDownload 函数 ---
            const generateDownload = () => {
                if (selectedIds.size === 0) {
                    alert("请至少选择一个对话！");
                    return;
                }

                const chatsToExport = conversations.filter(c => selectedIds.has(c.uuid));
                
                // 内部函数：生成单个文件内容
                const getFileContent = (chats) => {
                    let content = "";
                    let mimeType = "text/plain";
                    let ext = "txt";

                    // 1. WORD / DOC
                    if (exportFormat === 'doc') {
    ext = "doc";
    mimeType = "application/msword";
    
    let bodyContent = "";
    
    if (cleanDocMode) {
        // 纯净模式：纯文本格式（实质上是txt内容，但保存为.doc）
        chatsToExport.forEach(chat => {
            bodyContent += `${chat.name}\n`;
            bodyContent += `${formatDate(chat.created_at)} · ${chat.wordCount} 字\n\n`;
            
            chat.messages.forEach(msg => {
                const roleName = msg.role === 'user' ? 'User' : 'AI';
                bodyContent += `[${roleName}]: ${msg.content}\n\n`;
            });
            
            bodyContent += `\n${'='.repeat(50)}\n\n`; // 分隔符
        });
        
        // 纯文本内容，直接作为doc文件
        content = bodyContent;
        
    } else {
        // 气泡模式：HTML格式
        chatsToExport.forEach(chat => {
            bodyContent += `<div style="page-break-after: always;">`;
            bodyContent += `<h1 style="color:#2C3E50; border-bottom: 2px solid #8B4513; padding-bottom:10px;">${chat.name}</h1>`;
            bodyContent += `<p style="color:#888; font-size:0.9em;">时间: ${formatDate(chat.created_at)} | 字数: ${chat.wordCount}</p>`;
            
            chat.messages.forEach(msg => {
                let text = msg.content;
                text = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
                text = text.replace(/\n/g, "<br>");
                text = text.replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");
                text = text.replace(/\*(.*?)\*/g, "<i>$1</i>");

                const isUser = msg.role === 'user';
                const roleName = isUser ? 'User' : 'AI';
                const bg = isUser ? '#F0F7FB' : '#F0FBF7';
                const color = isUser ? '#2C3E50' : '#2E7D32';
                
                bodyContent += `
                    <div style="margin-bottom: 20px; padding: 10px; background-color: ${bg}; border-radius: 8px;">
                        <div style="font-weight: bold; color: ${color}; margin-bottom: 5px;">${roleName}</div>
                        <div style="line-height: 1.6;">${text}</div>
                    </div>
                `;
            });
            bodyContent += `</div>`;
        });

        content = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word'>
            <head><meta charset="utf-8"></head>
            <body style="font-family: 'Microsoft YaHei', sans-serif;">
                ${bodyContent}
            </body></html>
        `;
    }
}
                    // 2. MARKDOWN
                    else if (exportFormat === 'md') {
                        ext = "md";
                        chats.forEach(chat => {
                            content += `# ${chat.name}\n\n> 时间: ${formatDate(chat.created_at)} | 字数: ${chat.wordCount}\n\n---\n\n`;
                            chat.messages.forEach(msg => {
                                const role = msg.role === 'user' ? 'User' : 'AI';
                                content += `### ${role}\n\n${msg.content}\n\n`;
                            });
                            content += `\n---\n\n`;
                        });
                    }
                    // 3. JSON
                    else if (exportFormat === 'json') {
                        ext = "json";
                        mimeType = "application/json";
                        content = JSON.stringify(chats, null, 2);
                    }
                    // 4. TXT
                    else {
                        chats.forEach(chat => {
                            content += `========================================\n对话: ${chat.name}\n时间: ${formatDate(chat.created_at)}\n========================================\n\n`;
                            chat.messages.forEach(msg => {
                                const role = msg.role === 'user' ? 'Me' : 'AI';
                                content += `[${role}]:\n${msg.content}\n\n----------------------------------------\n\n`;
                            });
                            content += `\n\n`;
                        });
                    }
                    return { content, mimeType, ext };
                };

                // 执行下载动作
                const triggerDownload = (data, filename) => {
                    const blob = new Blob([data.content], { type: data.mimeType });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                };

                // --- 分支逻辑：独立下载 vs 合并下载 ---
                if (downloadMode === 'separate') {
                    // 独立下载：循环处理，使用 setTimeout 防止浏览器拦截
                    if (confirm(`即将下载 ${chatsToExport.length} 个文件，请允许浏览器下载多个文件。`)) {
                        chatsToExport.forEach((chat, index) => {
                            setTimeout(() => {
                                const data = getFileContent([chat]);
                                const safeName = chat.name.replace(/[\\/:*?"<>|]/g, '_').substring(0, 30);
                                triggerDownload(data, `${safeName}.${data.ext}`);
                            }, index * 500); // 每隔 0.5 秒下载一个
                        });
                    }
                } else {
                    // 合并下载：旧逻辑
                    const data = getFileContent(chatsToExport);
                    const filename = chatsToExport.length === 1 
                        ? `${chatsToExport[0].name.replace(/[\\/:*?"<>|]/g, '_').substring(0, 30)}.${data.ext}`
                        : `Chat_Export_${new Date().toISOString().slice(0,10)}_${chatsToExport.length}files.${data.ext}`;
                    triggerDownload(data, filename);
                }
            };

            // --- UI 渲染 ---

            if (conversations.length === 0) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white card-shadow rounded-2xl p-8 text-center border-t-4 border-cornflower">
                            <div className="mx-auto w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4">
                                <svg className="w-8 h-8 text-cornflower" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                            </div>
                            <h1 className="text-2xl font-bold text-ink mb-2">AI 聊天记录转换</h1>
                            <p className="text-gray-500 mb-6 text-sm">支持 Claude, ChatGPT, Grok, DeepSeek</p>
                            
                            
                            <label className="block w-full cursor-pointer bg-cornflower hover:bg-cornflowerDark text-white font-semibold py-3 px-4 rounded-lg transition duration-200 shadow-md transform hover:-translate-y-0.5">
                                选择 JSON/HTML 文件
                                <input type="file" accept=".json,.html" onChange={handleFileUpload} className="hidden" />
                            </label>
                            
                            <p className="mt-4 text-xs text-gray-400">本地解析，数据不上传服务器</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto md:p-6">
                    {/* 左侧侧边栏 */}
                    <div className={`w-full md:w-1/3 lg:w-1/4 bg-white md:rounded-l-2xl card-shadow z-10 flex flex-col h-screen md:h-[85vh] ${viewMode === 'preview' ? 'hidden md:flex' : 'flex'}`}>
                        {/* 头部 & 返回按钮 */}
                        <div className="p-4 border-b border-gray-100 bg-[#faf8f4]">
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="font-bold text-lg text-ink">对话列表</h2>
                                <button onClick={resetApp} className="text-xs text-earth hover:text-red-600 underline flex items-center" title="清除数据并返回首页">
                                    <svg className="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 15l-3-3m0 0l3-3m-3 3h8M3 12a9 9 0 1118 0 9 9 0 01-18 0z"></path></svg>
                                    重置
                                </button>
                            </div>
                            <div className="relative">
                                <input 
                                    type="text" 
                                    placeholder="搜索标题或内容..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2 bg-white border border-gray-200 rounded-lg text-sm focus:outline-none focus:border-cornflower focus:ring-1 focus:ring-cornflower"
                                />
                                <svg className="w-4 h-4 text-gray-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                        </div>

                        {/* 全选控制 */}
                        <div className="px-4 py-2 bg-white border-b border-gray-100 flex items-center justify-between">
                            <label className="flex items-center space-x-2 cursor-pointer text-sm text-gray-600 select-none hover:text-cornflower transition">
                                <input 
                                    type="checkbox" 
                                    checked={filteredConversations.length > 0 && selectedIds.size === filteredConversations.length}
                                    onChange={toggleSelectAll}
                                    className="rounded text-cornflower focus:ring-cornflower border-gray-300 w-4 h-4"
                                />
                                <span>全选 ({filteredConversations.length})</span>
                            </label>
                            <span className="text-xs text-earth font-medium">已选 {selectedIds.size} 项</span>
                        </div>

                        {/* 列表 */}
                        <div className="flex-1 overflow-y-auto scrollbar-custom p-2 space-y-2 bg-[#fdfbf7]">
                            {filteredConversations.length === 0 && (
                                <div className="text-center py-10 text-gray-400 text-sm">没有找到匹配的对话</div>
                            )}
                            {filteredConversations.map(chat => {
                                const isSelected = selectedIds.has(chat.uuid);
                                return (
                                    <div 
                                        key={chat.uuid}
                                        onClick={() => toggleSelect(chat.uuid)}
                                        className={`p-3 rounded-lg cursor-pointer border transition-all duration-200 group flex items-start space-x-3 ${
                                            isSelected
                                                ? 'bg-blue-50 border-cornflower shadow-sm' 
                                                : 'bg-white border-transparent hover:border-blue-200 hover:bg-white'
                                        }`}
                                    >
                                        <div className="pt-1">
                                            <input 
                                                type="checkbox" 
                                                checked={isSelected}
                                                onChange={() => {}} // 由父 div 控制
                                                className="w-4 h-4 rounded text-cornflower border-gray-300 focus:ring-cornflower"
                                            />
                                        </div>
                                        <div className="flex-1 min-w-0">
                                            <h3 className={`text-sm font-semibold truncate ${isSelected ? 'text-cornflowerDark' : 'text-gray-700'}`}>
                                                {chat.name}
                                            </h3>
                                            <div className="flex items-center space-x-3 mt-1 text-xs text-gray-400">
                                                <span>{formatDate(chat.created_at)}</span>
                                                <span className="text-earth opacity-70">{chat.wordCount} 字</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {/* 移动端底部按钮 */}
                        <div className="md:hidden p-4 bg-white border-t border-gray-100">
                             <button 
                                onClick={() => setViewMode('preview')}
                                className="w-full bg-cornflower text-white py-2 rounded-lg font-medium shadow-md"
                             >
                                去导出 ({selectedIds.size})
                             </button>
                        </div>
                    </div>

                    {/* 右侧主区域 (导出控制台) */}
                    <div className={`flex-1 bg-white md:rounded-r-2xl md:ml-0 card-shadow h-screen md:h-[85vh] flex flex-col ${viewMode === 'list' ? 'hidden md:flex' : 'flex'}`}>
                        {/* 移动端返回栏 */}
                        <div className="md:hidden p-4 border-b border-gray-100 flex items-center justify-between">
                            <div className="flex items-center">
                                <button onClick={() => setViewMode('list')} className="text-gray-500 mr-3">
                                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                                </button>
                                <h2 className="font-bold">导出设置</h2>
                            </div>
                            <button onClick={resetApp} className="text-xs text-red-500 font-medium">重置</button>
                        </div>

                        {/* 顶部状态 */}
                        <div className="p-8 flex-1 flex flex-col justify-center items-center bg-[#faf8f4] overflow-y-auto">
                            <div className="max-w-md w-full">
                                <h2 className="text-2xl font-bold text-ink mb-6 text-center">导出选项（多选将导出为同一份文件）</h2>
                                
                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm mb-6">
                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">已选对话</label>
                                        <div className={`p-3 rounded-lg text-sm font-medium flex justify-between items-center ${selectedIds.size > 0 ? 'bg-blue-50 text-cornflowerDark' : 'bg-gray-50 text-gray-500'}`}>
                                            <span>{selectedIds.size} 个对话</span>
                                            {selectedIds.size === 0 && <span className="text-xs text-red-400">请在左侧勾选</span>}
                                        </div>
                                    </div>

                                    <div className="mb-5">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">文件格式</label>
                                        <div className="grid grid-cols-3 gap-2">
                                            {['doc', 'md', 'txt', 'json'].map(fmt => (
                                                <button
                                                    key={fmt}
                                                    onClick={() => setExportFormat(fmt)}
                                                    className={`py-2 px-3 rounded-md text-sm font-medium border transition-all ${
                                                        exportFormat === fmt 
                                                            ? 'bg-cornflower text-white border-cornflower shadow-sm' 
                                                            : 'bg-white text-gray-600 border-gray-200 hover:border-cornflower hover:text-cornflower'
                                                    }`}
                                                >
                                                    {fmt.toUpperCase()}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    {/* --- 新增：下载模式选择 --- */}
                                    <div className="mb-5">
                                        <label className="block text-sm font-medium text-gray-700 mb-2">下载方式</label>
                                        <div className="flex bg-gray-100 p-1 rounded-lg">
                                            <button
                                                onClick={() => setDownloadMode('merge')}
                                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${
                                                    downloadMode === 'merge' 
                                                        ? 'bg-white text-cornflowerDark shadow-sm' 
                                                        : 'text-gray-500 hover:text-gray-700'
                                                }`}
                                            >
                                                合并为一个文件
                                            </button>
                                            <button
                                                onClick={() => setDownloadMode('separate')}
                                                className={`flex-1 py-2 text-sm font-medium rounded-md transition-all ${
                                                    downloadMode === 'separate' 
                                                        ? 'bg-white text-cornflowerDark shadow-sm' 
                                                        : 'text-gray-500 hover:text-gray-700'
                                                }`}
                                            >
                                                每个对话独立文件
                                            </button>
                                        </div>
                                    </div>
                                    {/* ------------------------- */}
                                    {/* 仅在选择 DOC 时显示的纯净模式选项 */}
                                    {exportFormat === 'doc' && (
                                        <div className="mb-6 pt-4 border-t border-gray-100">
                                            <div className="flex items-center justify-between">
                                                <div>
                                                    <h4 className="text-sm font-medium text-gray-700">纯净文档模式</h4>
                                                    <p className="text-xs text-gray-400 mt-1">无美化</p>
                                                </div>
                                                <div className="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                                                    <input 
                                                        type="checkbox" 
                                                        name="toggle" 
                                                        id="toggle" 
                                                        checked={cleanDocMode}
                                                        onChange={(e) => setCleanDocMode(e.target.checked)}
                                                        className="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer border-gray-300"
                                                    />
                                                    <label htmlFor="toggle" className={`toggle-label block overflow-hidden h-6 rounded-full cursor-pointer transition-colors ${cleanDocMode ? 'bg-cornflower' : 'bg-gray-300'}`}></label>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                    
                                    <button 
                                        onClick={generateDownload}
                                        disabled={selectedIds.size === 0}
                                        className={`w-full py-3 rounded-lg font-bold text-white shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 ${
                                            selectedIds.size === 0 
                                                ? 'bg-gray-300 cursor-not-allowed shadow-none' 
                                                : 'bg-[#8B4513] hover:bg-[#723a10] shadow-brown-500/30'
                                        }`}
                                    >
                                        {selectedIds.size === 0 ? '请先选择左侧对话' : `导出 ${selectedIds.size} 个对话 (${exportFormat.toUpperCase()})`}
                                    </button>
                                </div>

                                <div className="text-center text-sm text-gray-400">
                                    <p>Claude & ChatGPT & DeepSeek & Grok</p>
                                    <p className="text-xs mt-1 opacity-50">Local Processing Only</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
